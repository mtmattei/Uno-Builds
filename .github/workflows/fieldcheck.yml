name: FieldCheck (Uno) build & verify

on:
  push:
    branches: [ "claude/blissful-lovelace-xnx496" ]
    paths: [ "FieldCheck/**", ".github/workflows/fieldcheck.yml" ]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Verification scenario"
        required: false
        default: "full"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  APP_DIR: FieldCheck/app/FieldCheck
  SCENARIO: ${{ github.event.inputs.scenario || 'full' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/out
          dotnet --info > $GITHUB_WORKSPACE/out/dotnet-info-linux.txt
          dotnet test FieldCheck.Tests/FieldCheck.Tests.csproj -c Release -p:OverrideTargetFrameworks=net10.0 --logger "trx;LogFileName=unit-tests.trx" --results-directory $GITHUB_WORKSPACE/out 2>&1 | tee $GITHUB_WORKSPACE/out/unit-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          path: out/

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"
      - name: Install Android workload
        run: dotnet workload install android --skip-sign-check
      - name: Build Release APK
        working-directory: ${{ env.APP_DIR }}/FieldCheck
        run: |
          mkdir -p $GITHUB_WORKSPACE/out
          { dotnet --info; dotnet workload list; java -version 2>&1; echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools; } > $GITHUB_WORKSPACE/out/android-toolchain.txt 2>&1
          set -o pipefail
          dotnet build -c Release -f net10.0-android -p:OverrideTargetFrameworks=net10.0-android -p:AndroidPackageFormat=apk 2>&1 | tee $GITHUB_WORKSPACE/out/android-build.txt
          find bin/Release/net10.0-android -name "*-Signed.apk" -exec cp {} $GITHUB_WORKSPACE/out/fieldcheck.apk \;
          ls -la $GITHUB_WORKSPACE/out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash FieldCheck/ci/android_e2e.sh "$GITHUB_WORKSPACE/out/fieldcheck.apk" "$GITHUB_WORKSPACE/out/android" "$SCENARIO"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android
          path: out/

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build Release (Windows App SDK, unpackaged)
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}/FieldCheck
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/out" | Out-Null
          dotnet --info | Out-File "$env:GITHUB_WORKSPACE/out/windows-toolchain.txt"
          dotnet build -c Release -f net10.0-windows10.0.26100 -p:OverrideTargetFrameworks=net10.0-windows10.0.26100 -p:Platform=x64 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE/out/windows-build.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse bin -Filter FieldCheck.exe | Where-Object { $_.FullName -match "Release" } | Select-Object -ExpandProperty FullName | Tee-Object "$env:GITHUB_WORKSPACE/out/windows-exe-path.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: UI verification
        shell: pwsh
        run: |
          python -m pip install --quiet pywinauto pillow
          $exe = (Get-Content "$env:GITHUB_WORKSPACE/out/windows-exe-path.txt" | Select-Object -First 1)
          python FieldCheck/ci/windows_e2e.py "$exe" "$env:GITHUB_WORKSPACE/out/windows" "$env:SCENARIO"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: out/

  publish-results:
    # Artifact downloads are blocked in the agent's network policy, so CI outputs are committed back to the branch.
    needs: [unit-tests, android, windows]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: Commit results
        run: |
          DEST="FieldCheck/results/ci/run-${{ github.run_number }}-${{ env.SCENARIO }}"
          mkdir -p "$DEST"
          find incoming -name "*.apk" -delete
          cp -r incoming/* "$DEST"/
          echo "${{ github.sha }}" > "$DEST/source-commit.txt"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$DEST/run-url.txt"
          git config user.name "fieldcheck-ci"
          git config user.email "fieldcheck-ci@users.noreply.github.com"
          git add "$DEST"
          git commit -m "ci: FieldCheck verification outputs run ${{ github.run_number }} (${{ env.SCENARIO }})" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break; sleep $((i*5)); done
