<svg width="450" height="200" viewBox="0 0 450 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Component: Comparison Matrix -->
  <!-- Used in: Analytics -->
  
  <!-- Background -->
  <rect width="450" height="200" fill="#111113"/>
  
  <!-- Header Row -->
  <rect x="0" y="0" width="450" height="36" fill="#18181b"/>
  <text x="20" y="24" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a" letter-spacing="1"></text>
  <text x="180" y="24" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a" letter-spacing="1">THIS WEEK</text>
  <text x="280" y="24" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a" letter-spacing="1">LAST WEEK</text>
  <text x="380" y="24" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a" letter-spacing="1">CHANGE</text>
  <line x1="0" y1="36" x2="450" y2="36" stroke="#27272a" stroke-width="1"/>
  
  <!-- Row 1 -->
  <g transform="translate(0, 36)">
    <text x="20" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a1a1aa">Units Produced</text>
    <text x="180" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#71717a">24,180</text>
    <text x="280" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#3f3f46">23,450</text>
    <text x="380" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#71717a">+3.1%</text>
    <line x1="0" y1="40" x2="450" y2="40" stroke="#27272a" stroke-width="1"/>
  </g>
  
  <!-- Row 2 -->
  <g transform="translate(0, 77)">
    <text x="20" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a1a1aa">Defect Rate</text>
    <text x="180" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#71717a">1.2%</text>
    <text x="280" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#3f3f46">1.4%</text>
    <text x="380" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#4ade80">-0.2%</text>
    <line x1="0" y1="40" x2="450" y2="40" stroke="#27272a" stroke-width="1"/>
  </g>
  
  <!-- Row 3 -->
  <g transform="translate(0, 118)">
    <text x="20" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a1a1aa">Downtime Hours</text>
    <text x="180" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#71717a">4.2h</text>
    <text x="280" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#3f3f46">6.8h</text>
    <text x="380" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#4ade80">-38%</text>
    <line x1="0" y1="40" x2="450" y2="40" stroke="#27272a" stroke-width="1"/>
  </g>
  
  <!-- Row 4 -->
  <g transform="translate(0, 159)">
    <text x="20" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a1a1aa">Energy Usage</text>
    <text x="180" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#71717a">8.4MW</text>
    <text x="280" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#3f3f46">8.9MW</text>
    <text x="380" y="28" font-family="IBM Plex Mono, monospace" font-size="11" fill="#4ade80">-5.6%</text>
  </g>
</svg>
