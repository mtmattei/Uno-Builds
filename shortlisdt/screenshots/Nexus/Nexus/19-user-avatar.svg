<svg width="400" height="160" viewBox="0 0 400 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Component: User Avatar & Row -->
  <!-- Used in: Settings (User Management) -->
  
  <!-- Background -->
  <rect width="400" height="160" fill="#0a0a0b"/>
  
  <!-- Label -->
  <text x="20" y="30" font-family="IBM Plex Mono, monospace" font-size="9" fill="#3f3f46" letter-spacing="1">USER AVATARS</text>
  
  <!-- Avatar 1 -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="36" height="36" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="18" y="24" font-family="IBM Plex Mono, monospace" font-size="11" fill="#71717a" text-anchor="middle">AU</text>
    <text x="50" y="16" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a1a1aa">Admin User</text>
    <text x="50" y="30" font-family="IBM Plex Mono, monospace" font-size="9" fill="#71717a">admin@nexus.io</text>
  </g>
  
  <!-- Avatar 2 -->
  <g transform="translate(200, 50)">
    <rect x="0" y="0" width="36" height="36" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="18" y="24" font-family="IBM Plex Mono, monospace" font-size="11" fill="#71717a" text-anchor="middle">MC</text>
    <text x="50" y="16" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a1a1aa">M. Chen</text>
    <text x="50" y="30" font-family="IBM Plex Mono, monospace" font-size="9" fill="#71717a">m.chen@nexus.io</text>
  </g>
  
  <!-- Avatar 3 -->
  <g transform="translate(20, 110)">
    <rect x="0" y="0" width="36" height="36" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="18" y="24" font-family="IBM Plex Mono, monospace" font-size="11" fill="#71717a" text-anchor="middle">JS</text>
    <text x="50" y="16" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a1a1aa">J. Santos</text>
    <text x="50" y="30" font-family="IBM Plex Mono, monospace" font-size="9" fill="#71717a">j.santos@nexus.io</text>
  </g>
  
  <!-- Avatar 4 -->
  <g transform="translate(200, 110)">
    <rect x="0" y="0" width="36" height="36" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="18" y="24" font-family="IBM Plex Mono, monospace" font-size="11" fill="#71717a" text-anchor="middle">RK</text>
    <text x="50" y="16" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a1a1aa">R. Kim</text>
    <text x="50" y="30" font-family="IBM Plex Mono, monospace" font-size="9" fill="#71717a">r.kim@nexus.io</text>
  </g>
</svg>
