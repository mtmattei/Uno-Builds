<svg width="600" height="80" viewBox="0 0 600 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Component: Navigation Tabs -->
  <!-- Used in: All pages (header) -->
  
  <!-- Background -->
  <rect width="600" height="80" fill="#0a0a0b"/>
  
  <!-- Tab Bar Background -->
  <rect x="0" y="20" width="600" height="40" fill="#0a0a0b"/>
  
  <!-- Active Tab -->
  <g transform="translate(0, 20)">
    <!-- Active Indicator Dot -->
    <circle cx="8" cy="20" r="2" fill="#a1a1aa"/>
    <!-- Tab Text -->
    <text x="24" y="24" font-family="IBM Plex Mono, monospace" font-size="11" fill="#fafafa" letter-spacing="2">OVERVIEW</text>
    <!-- Active Underline -->
    <line x1="0" y1="40" x2="100" y2="40" stroke="#a1a1aa" stroke-width="1"/>
  </g>
  
  <!-- Inactive Tab 1 -->
  <g transform="translate(120, 20)">
    <circle cx="8" cy="20" r="2" fill="#27272a" opacity="0"/>
    <text x="24" y="24" font-family="IBM Plex Mono, monospace" font-size="11" fill="#71717a" letter-spacing="2">PRODUCTION</text>
  </g>
  
  <!-- Inactive Tab 2 -->
  <g transform="translate(250, 20)">
    <circle cx="8" cy="20" r="2" fill="#27272a" opacity="0"/>
    <text x="24" y="24" font-family="IBM Plex Mono, monospace" font-size="11" fill="#71717a" letter-spacing="2">ANALYTICS</text>
  </g>
  
  <!-- Inactive Tab 3 -->
  <g transform="translate(370, 20)">
    <circle cx="8" cy="20" r="2" fill="#27272a" opacity="0"/>
    <text x="24" y="24" font-family="IBM Plex Mono, monospace" font-size="11" fill="#71717a" letter-spacing="2">MAINTENANCE</text>
  </g>
  
  <!-- Inactive Tab 4 -->
  <g transform="translate(505, 20)">
    <circle cx="8" cy="20" r="2" fill="#27272a" opacity="0"/>
    <text x="24" y="24" font-family="IBM Plex Mono, monospace" font-size="11" fill="#71717a" letter-spacing="2">SETTINGS</text>
  </g>
  
  <!-- Bottom Border -->
  <line x1="0" y1="60" x2="600" y2="60" stroke="#27272a" stroke-width="1"/>
</svg>
