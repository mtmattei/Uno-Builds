<svg width="400" height="220" viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Component: Form Inputs -->
  <!-- Used in: Settings -->
  
  <!-- Background -->
  <rect width="400" height="220" fill="#0a0a0b"/>
  
  <!-- Label -->
  <text x="20" y="30" font-family="IBM Plex Mono, monospace" font-size="9" fill="#3f3f46" letter-spacing="1">SELECT DROPDOWN</text>
  
  <!-- Select Input -->
  <g transform="translate(20, 45)">
    <rect x="0" y="0" width="120" height="32" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="12" y="21" font-family="IBM Plex Mono, monospace" font-size="10" fill="#a1a1aa" letter-spacing="1">90 DAYS</text>
    <!-- Dropdown Arrow -->
    <path d="M100 13 L106 18 L112 13" stroke="#71717a" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Select Options Preview -->
  <g transform="translate(160, 45)">
    <rect x="0" y="0" width="100" height="32" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="12" y="21" font-family="IBM Plex Mono, monospace" font-size="10" fill="#a1a1aa" letter-spacing="1">CELSIUS</text>
    <path d="M80 13 L86 18 L92 13" stroke="#71717a" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Label -->
  <text x="20" y="110" font-family="IBM Plex Mono, monospace" font-size="9" fill="#3f3f46" letter-spacing="1">TEXT INPUT WITH UNIT</text>
  
  <!-- Text Input -->
  <g transform="translate(20, 125)">
    <rect x="0" y="0" width="60" height="32" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="48" y="21" font-family="IBM Plex Mono, monospace" font-size="11" fill="#fafafa" text-anchor="end">85</text>
    <text x="72" y="21" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a">°C</text>
  </g>
  
  <!-- Text Input 2 -->
  <g transform="translate(140, 125)">
    <rect x="0" y="0" width="60" height="32" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="48" y="21" font-family="IBM Plex Mono, monospace" font-size="11" fill="#fafafa" text-anchor="end">4.5</text>
    <text x="72" y="21" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a">bar</text>
  </g>
  
  <!-- Text Input 3 -->
  <g transform="translate(260, 125)">
    <rect x="0" y="0" width="60" height="32" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="48" y="21" font-family="IBM Plex Mono, monospace" font-size="11" fill="#fafafa" text-anchor="end">2.5</text>
    <text x="72" y="21" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a">mm/s</text>
  </g>
  
  <!-- Label -->
  <text x="20" y="190" font-family="IBM Plex Mono, monospace" font-size="9" fill="#3f3f46" letter-spacing="1">FOCUS STATE</text>
  
  <!-- Focused Input -->
  <g transform="translate(20, 200)">
    <rect x="0" y="0" width="60" height="32" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="48" y="21" font-family="IBM Plex Mono, monospace" font-size="11" fill="#fafafa" text-anchor="end">15</text>
    <text x="72" y="21" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a">%</text>
  </g>
</svg>
