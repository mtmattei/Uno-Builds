<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Component: Panel -->
  <!-- Used in: All pages as content container -->
  
  <defs>
    <linearGradient id="panelTopEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  
  <!-- Panel Background -->
  <rect x="1" y="1" width="398" height="198" fill="#111113" stroke="#27272a" stroke-width="1"/>
  
  <!-- Top Edge Gradient -->
  <line x1="20" y1="1" x2="380" y2="1" stroke="url(#panelTopEdge)" stroke-width="1"/>
  
  <!-- Header Background -->
  <rect x="1" y="1" width="398" height="48" fill="#111113"/>
  
  <!-- Header Divider -->
  <line x1="1" y1="49" x2="399" y2="49" stroke="#27272a" stroke-width="1"/>
  
  <!-- Title Node -->
  <circle cx="20" cy="25" r="2" fill="#71717a"/>
  
  <!-- Title -->
  <text x="32" y="29" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a1a1aa" letter-spacing="2">PANEL TITLE</text>
  
  <!-- Action Button -->
  <rect x="300" y="14" width="80" height="22" fill="transparent" stroke="#27272a" stroke-width="1"/>
  <text x="340" y="29" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a" letter-spacing="1" text-anchor="middle">ACTION</text>
  
  <!-- Content Area Placeholder -->
  <text x="200" y="125" font-family="IBM Plex Mono, monospace" font-size="10" fill="#3f3f46" text-anchor="middle">CONTENT AREA</text>
</svg>
