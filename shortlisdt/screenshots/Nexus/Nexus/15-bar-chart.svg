<svg width="420" height="240" viewBox="0 0 420 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Component: Bar Chart (Weekly Output) -->
  <!-- Used in: Analytics -->
  
  <!-- Background -->
  <rect width="420" height="240" fill="#111113"/>
  
  <!-- Grid Pattern -->
  <defs>
    <pattern id="chartGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="30" y="20" width="360" height="180" fill="url(#chartGrid)"/>
  
  <!-- Target Line -->
  <line x1="30" y1="60" x2="390" y2="60" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="22" y="64" font-family="IBM Plex Mono, monospace" font-size="8" fill="#71717a" text-anchor="end">4K</text>
  
  <!-- Y Axis Labels -->
  <text x="22" y="200" font-family="IBM Plex Mono, monospace" font-size="8" fill="#71717a" text-anchor="end">0</text>
  
  <!-- Bars -->
  <!-- Monday -->
  <rect x="50" y="81" width="28" height="119" fill="#52525b"/>
  <circle cx="64" cy="81" r="3" fill="#a1a1aa"/>
  <text x="64" y="215" font-family="IBM Plex Mono, monospace" font-size="8" fill="#71717a" text-anchor="middle">MON</text>
  
  <!-- Tuesday -->
  <rect x="100" y="83" width="28" height="117" fill="#52525b"/>
  <circle cx="114" cy="83" r="3" fill="#a1a1aa"/>
  <text x="114" y="215" font-family="IBM Plex Mono, monospace" font-size="8" fill="#71717a" text-anchor="middle">TUE</text>
  
  <!-- Wednesday -->
  <rect x="150" y="90" width="28" height="110" fill="#52525b"/>
  <circle cx="164" cy="90" r="3" fill="#a1a1aa"/>
  <text x="164" y="215" font-family="IBM Plex Mono, monospace" font-size="8" fill="#71717a" text-anchor="middle">WED</text>
  
  <!-- Thursday -->
  <rect x="200" y="77" width="28" height="123" fill="#52525b"/>
  <circle cx="214" cy="77" r="3" fill="#a1a1aa"/>
  <text x="214" y="215" font-family="IBM Plex Mono, monospace" font-size="8" fill="#71717a" text-anchor="middle">THU</text>
  
  <!-- Friday -->
  <rect x="250" y="79" width="28" height="121" fill="#52525b"/>
  <circle cx="264" cy="79" r="3" fill="#a1a1aa"/>
  <text x="264" y="215" font-family="IBM Plex Mono, monospace" font-size="8" fill="#71717a" text-anchor="middle">FRI</text>
  
  <!-- Saturday -->
  <rect x="300" y="141" width="28" height="59" fill="#52525b"/>
  <circle cx="314" cy="141" r="3" fill="#a1a1aa"/>
  <text x="314" y="215" font-family="IBM Plex Mono, monospace" font-size="8" fill="#71717a" text-anchor="middle">SAT</text>
  
  <!-- Sunday (no production) -->
  <rect x="350" y="197" width="28" height="3" fill="#52525b"/>
  <circle cx="364" cy="197" r="3" fill="#a1a1aa"/>
  <text x="364" y="215" font-family="IBM Plex Mono, monospace" font-size="8" fill="#71717a" text-anchor="middle">SUN</text>
</svg>
