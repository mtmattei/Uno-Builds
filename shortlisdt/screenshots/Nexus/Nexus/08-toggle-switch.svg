<svg width="300" height="120" viewBox="0 0 300 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Component: Toggle Switch -->
  <!-- Used in: Settings -->
  
  <!-- Background -->
  <rect width="300" height="120" fill="#0a0a0b"/>
  
  <!-- Label -->
  <text x="20" y="30" font-family="IBM Plex Mono, monospace" font-size="9" fill="#3f3f46" letter-spacing="1">TOGGLE SWITCHES</text>
  
  <!-- Off State -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="40" height="20" rx="10" fill="#27272a"/>
    <circle cx="10" cy="10" r="8" fill="#71717a"/>
    <text x="55" y="14" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a">OFF</text>
  </g>
  
  <!-- On State -->
  <g transform="translate(140, 50)">
    <rect x="0" y="0" width="40" height="20" rx="10" fill="#52525b"/>
    <circle cx="30" cy="10" r="8" fill="#fafafa"/>
    <text x="55" y="14" font-family="IBM Plex Mono, monospace" font-size="10" fill="#a1a1aa">ON</text>
  </g>
  
  <!-- With Label -->
  <g transform="translate(20, 90)">
    <text x="0" y="0" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a1a1aa" letter-spacing="1">AUTO BACKUP</text>
    <text x="0" y="16" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a">Automatically backup system data daily</text>
    <rect x="220" y="-4" width="40" height="20" rx="10" fill="#52525b"/>
    <circle cx="250" cy="6" r="8" fill="#fafafa"/>
  </g>
</svg>
