<svg width="240" height="160" viewBox="0 0 240 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Component: Metric Card -->
  <!-- Used in: Overview, Analytics -->
  
  <defs>
    <linearGradient id="topEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  
  <!-- Card Background -->
  <rect x="1" y="1" width="238" height="158" fill="#111113" stroke="#27272a" stroke-width="1"/>
  
  <!-- Top Edge Gradient -->
  <line x1="0" y1="1" x2="240" y2="1" stroke="url(#topEdge)" stroke-width="1"/>
  
  <!-- Corner Nodes -->
  <circle cx="1" cy="1" r="4" fill="#0a0a0b" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="239" cy="1" r="4" fill="#0a0a0b" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="1" cy="159" r="4" fill="#0a0a0b" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="239" cy="159" r="4" fill="#0a0a0b" stroke="#3f3f46" stroke-width="1"/>
  
  <!-- Label -->
  <text x="20" y="36" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a" letter-spacing="2">THROUGHPUT</text>
  
  <!-- Value -->
  <text x="20" y="80" font-family="Space Grotesk, sans-serif" font-size="36" font-weight="300" fill="#fafafa">847.2</text>
  
  <!-- Unit -->
  <text x="20" y="100" font-family="IBM Plex Mono, monospace" font-size="11" fill="#71717a">units/hr</text>
  
  <!-- Footer Divider -->
  <line x1="20" y1="120" x2="220" y2="120" stroke="#27272a" stroke-width="1"/>
  
  <!-- Trend -->
  <text x="20" y="143" font-family="IBM Plex Mono, monospace" font-size="11" fill="#4ade80">+2.4%</text>
  
  <!-- Status Indicator -->
  <circle cx="180" cy="140" r="3" fill="#4ade80">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="190" y="143" font-family="IBM Plex Mono, monospace" font-size="9" fill="#71717a" letter-spacing="1">NOMINAL</text>
</svg>
