<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Component: Inventory Bar with Threshold -->
  <!-- Used in: Production (Material Inventory) -->
  
  <!-- Background -->
  <rect width="400" height="200" fill="#111113"/>
  
  <!-- Item 1: In Stock -->
  <g transform="translate(20, 20)">
    <text x="0" y="0" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a1a1aa">Steel Alloy 304</text>
    <text x="360" y="0" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4ade80" text-anchor="end" letter-spacing="1">IN STOCK</text>
    
    <!-- Bar Container -->
    <rect x="0" y="15" width="300" height="3" fill="#27272a"/>
    <!-- Fill -->
    <rect x="0" y="15" width="246" height="3" fill="#71717a"/>
    <!-- Threshold Marker -->
    <rect x="150" y="11" width="1" height="11" fill="#fbbf24"/>
    
    <!-- Value -->
    <text x="360" y="20" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a" text-anchor="end">82 tons</text>
  </g>
  
  <!-- Item 2: Low Stock -->
  <g transform="translate(20, 70)">
    <text x="0" y="0" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a1a1aa">Polymer Compound B</text>
    <text x="360" y="0" font-family="IBM Plex Mono, monospace" font-size="9" fill="#fbbf24" text-anchor="end" letter-spacing="1">LOW STOCK</text>
    
    <!-- Bar Container -->
    <rect x="0" y="15" width="300" height="3" fill="#27272a"/>
    <!-- Fill (below threshold) -->
    <rect x="0" y="15" width="135" height="3" fill="#71717a"/>
    <!-- Threshold Marker -->
    <rect x="150" y="11" width="1" height="11" fill="#fbbf24"/>
    
    <!-- Value -->
    <text x="360" y="20" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a" text-anchor="end">45 kg</text>
  </g>
  
  <!-- Item 3: Good Stock -->
  <g transform="translate(20, 120)">
    <text x="0" y="0" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a1a1aa">Copper Wire 2.5mm</text>
    <text x="360" y="0" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4ade80" text-anchor="end" letter-spacing="1">IN STOCK</text>
    
    <!-- Bar Container -->
    <rect x="0" y="15" width="300" height="3" fill="#27272a"/>
    <!-- Fill -->
    <rect x="0" y="15" width="300" height="3" fill="#71717a"/>
    <!-- Threshold Marker -->
    <rect x="75" y="11" width="1" height="11" fill="#fbbf24"/>
    
    <!-- Value -->
    <text x="360" y="20" font-family="IBM Plex Mono, monospace" font-size="10" fill="#71717a" text-anchor="end">1250 m</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(20, 170)">
    <rect x="0" y="0" width="1" height="10" fill="#fbbf24"/>
    <text x="10" y="9" font-family="IBM Plex Mono, monospace" font-size="9" fill="#71717a">Reorder threshold</text>
  </g>
</svg>
