<svg viewBox="0 0 720 80" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'DM Sans', system-ui, sans-serif; }
  </style>

  <!-- Title -->
  <text x="0" y="26" font-size="26" font-weight="700" fill="#1F2937">Kitchen Renovation</text>

  <!-- Meta row -->
  <text x="0" y="50" font-size="13" fill="#6B7280">👤 Bob Johnson</text>
  <text x="130" y="50" font-size="13" fill="#6B7280">📄 QC-2026-0042</text>
  <text x="282" y="50" font-size="13" fill="#6B7280">📅 Valid until Feb 25</text>
  <!-- Status badge -->
  <rect x="446" y="37" width="60" height="22" rx="10" fill="#DBEAFE"/>
