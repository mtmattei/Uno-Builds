<svg viewBox="0 0 380 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'DM Sans', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- Row background -->
  <rect width="380" height="60" rx="8" fill="#FFFFFF"/>
  <line x1="0" y1="59.5" x2="380" y2="59.5" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Avatar -->
  <circle cx="37" cy="30" r="21" fill="#D6E4F0"/>
  <text x="37" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#2B4C7E">BJ</text>

  <!-- Info -->
  <text x="72" y="26" font-size="14" font-weight="600" fill="#1F2937">Bob Johnson</text>
  <text x="72" y="42" font-size="12" fill="#6B7280">3 quotes · Anytown</text>

  <!-- Value -->
  <text x="364" y="26" font-size="14" font-weight="600" fill="#2B4C7E" text-anchor="end" class="mono">$12,450</text>
  <text x="364" y="42" font-size="10" fill="#6B7280" text-anchor="end">total value</text>
</svg>
