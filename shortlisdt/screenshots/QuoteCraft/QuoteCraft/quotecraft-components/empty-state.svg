<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'DM Sans', system-ui, sans-serif; }
  </style>

  <!-- Icon -->
  <text x="160" y="52" text-anchor="middle" font-size="56" opacity="0.25">📋</text>

  <!-- Title -->
  <text x="160" y="100" text-anchor="middle" font-size="18" font-weight="600" fill="#1F2937">Select a quote</text>

  <!-- Description -->
  <text x="160" y="124" text-anchor="middle" font-size="14" fill="#6B7280">Choose a quote from the list to</text>
  <text x="160" y="142" text-anchor="middle" font-size="14" fill="#6B7280">view details, or create a new one.</text>

  <!-- Optional action button -->
  <rect x="110" y="162" width="100" height="36" rx="12" fill="#2B4C7E"/>
  <text x="160" y="185" text-anchor="middle" font-size="14" font-weight="600" fill="white">Create Quote</text>
</svg>
