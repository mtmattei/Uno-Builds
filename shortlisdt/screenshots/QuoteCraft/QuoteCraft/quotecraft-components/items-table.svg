<svg viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'DM Sans', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <defs>
    <filter id="ts" x="-1%" y="-2%" width="102%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Card outline -->
  <rect width="560" height="220" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#ts)"/>

  <!-- Header row -->
  <rect width="560" height="36" rx="12" fill="#F3F4F6"/>
  <rect y="24" width="560" height="12" fill="#F3F4F6"/>
  <text x="16" y="23" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="0.5">DESCRIPTION</text>
  <text x="340" y="23" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="0.5" text-anchor="end">QTY</text>
  <text x="430" y="23" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="0.5" text-anchor="end">UNIT PRICE</text>
  <text x="544" y="23" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="0.5" text-anchor="end">TOTAL</text>
  <line x1="0" y1="35.5" x2="560" y2="35.5" stroke="#1F2937" stroke-width="2"/>

  <!-- Row 1 -->
  <text x="16" y="59" font-size="14" font-weight="500" fill="#1F2937">Sink Installation</text>
  <text x="340" y="59" font-size="13" fill="#1F2937" text-anchor="end" class="mono">1</text>
  <text x="430" y="59" font-size="13" fill="#1F2937" text-anchor="end" class="mono">$350.00</text>
  <text x="544" y="59" font-size="13" font-weight="600" fill="#1F2937" text-anchor="end" class="mono">$350.00</text>
  <line x1="0" y1="71.5" x2="560" y2="71.5" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Row 2 (even — light bg) -->
  <rect y="72" width="560" height="36" fill="#FAFBFC"/>
  <text x="16" y="95" font-size="14" font-weight="500" fill="#1F2937">Copper Pipe (per ft)</text>
  <text x="340" y="95" font-size="13" fill="#1F2937" text-anchor="end" class="mono">25</text>
  <text x="430" y="95" font-size="13" fill="#1F2937" text-anchor="end" class="mono">$12.00</text>
  <text x="544" y="95" font-size="13" font-weight="600" fill="#1F2937" text-anchor="end" class="mono">$300.00</text>
  <line x1="0" y1="107.5" x2="560" y2="107.5" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="16" y="131" font-size="14" font-weight="500" fill="#1F2937">Labor (per hour)</text>
  <text x="340" y="131" font-size="13" fill="#1F2937" text-anchor="end" class="mono">24</text>
  <text x="430" y="131" font-size="13" fill="#1F2937" text-anchor="end" class="mono">$95.00</text>
  <text x="544" y="131" font-size="13" font-weight="600" fill="#1F2937" text-anchor="end" class="mono">$2,280.00</text>
  <line x1="0" y1="143.5" x2="560" y2="143.5" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Edit-mode footer -->
  <line x1="0" y1="155.5" x2="560" y2="155.5" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Add Line Item button (dashed) -->
  <rect x="16" y="166" width="140" height="34" rx="8" fill="none" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="86" y="188" text-anchor="middle" font-size="13" font-weight="500" fill="#2B4C7E">+ Add Line Item</text>

  <!-- From Catalog button (solid amber border) -->
  <rect x="166" y="166" width="120" height="34" rx="8" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="226" y="188" text-anchor="middle" font-size="13" font-weight="500" fill="#92400E">From Catalog</text>
</svg>
