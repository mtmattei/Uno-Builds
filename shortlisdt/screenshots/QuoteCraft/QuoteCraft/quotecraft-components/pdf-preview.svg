<svg viewBox="0 0 480 560" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'DM Sans', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <defs>
    <filter id="pdfs" x="-2%" y="-1%" width="104%" height="104%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Card -->
  <rect width="480" height="560" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#pdfs)"/>

  <!-- ── PDF Header ── -->
  <rect width="480" height="140" rx="12" fill="#2B4C7E"/>
  <rect y="128" width="480" height="12" fill="#2B4C7E"/>

  <!-- Logo placeholder -->
  <rect x="28" y="28" width="52" height="52" rx="8" fill="rgba(255,255,255,0.2)"/>
  <text x="54" y="60" text-anchor="middle" font-size="24" font-weight="700" fill="white">QC</text>

  <!-- Business info (right) -->
  <text x="452" y="44" text-anchor="end" font-size="18" font-weight="700" fill="white">Smith Plumbing LLC</text>
  <text x="452" y="62" text-anchor="end" font-size="13" fill="white" opacity="0.8">(555) 123-4567</text>
  <text x="452" y="78" text-anchor="end" font-size="13" fill="white" opacity="0.8">info@smithplumbing.com</text>

  <!-- Meta row -->
  <line x1="28" y1="100" x2="452" y2="100" stroke="white" stroke-width="1" opacity="0.2"/>

  <text x="28" y="118" font-size="12" fill="white" opacity="0.7">QUOTE #</text>
  <text x="28" y="134" font-size="12" font-weight="600" fill="white">QC-2026-0042</text>

  <text x="168" y="118" font-size="12" fill="white" opacity="0.7">DATE</text>
  <text x="168" y="134" font-size="12" font-weight="600" fill="white">Feb 10, 2026</text>

  <text x="308" y="118" font-size="12" fill="white" opacity="0.7">VALID UNTIL</text>
  <text x="308" y="134" font-size="12" font-weight="600" fill="white">Feb 25, 2026</text>

  <!-- ── PDF Body ── -->
  <!-- Client section -->
  <text x="28" y="170" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="1">PREPARED FOR</text>
  <text x="28" y="190" font-size="16" font-weight="600" fill="#1F2937">Bob Johnson</text>
  <text x="28" y="208" font-size="13" fill="#6B7280">123 Main St, Anytown</text>
  <line x1="28" y1="224" x2="452" y2="224" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Quote title -->
  <text x="28" y="250" font-size="18" font-weight="700" fill="#1F2937">Kitchen Renovation</text>

  <!-- Items table -->
  <rect x="28" y="264" width="424" height="28" fill="#F3F4F6"/>
  <text x="36" y="282" font-size="10" font-weight="700" fill="#6B7280" letter-spacing="0.5">DESCRIPTION</text>
  <text x="320" y="282" font-size="10" font-weight="700" fill="#6B7280" letter-spacing="0.5" text-anchor="end">QTY</text>
  <text x="388" y="282" font-size="10" font-weight="700" fill="#6B7280" letter-spacing="0.5" text-anchor="end">PRICE</text>
  <text x="444" y="282" font-size="10" font-weight="700" fill="#6B7280" letter-spacing="0.5" text-anchor="end">TOTAL</text>

  <!-- Row 1 -->
  <text x="36" y="308" font-size="12" font-weight="500" fill="#1F2937">Sink Installation</text>
  <text x="320" y="308" font-size="12" fill="#1F2937" text-anchor="end" class="mono">1</text>
  <text x="388" y="308" font-size="12" fill="#1F2937" text-anchor="end" class="mono">$350</text>
  <text x="444" y="308" font-size="12" font-weight="600" fill="#1F2937" text-anchor="end" class="mono">$350</text>
  <line x1="28" y1="316" x2="452" y2="316" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Row 2 -->
  <rect x="28" y="317" width="424" height="24" fill="#FAFBFC"/>
  <text x="36" y="334" font-size="12" font-weight="500" fill="#1F2937">Copper Pipe (per ft)</text>
  <text x="320" y="334" font-size="12" fill="#1F2937" text-anchor="end" class="mono">25</text>
  <text x="388" y="334" font-size="12" fill="#1F2937" text-anchor="end" class="mono">$12</text>
  <text x="444" y="334" font-size="12" font-weight="600" fill="#1F2937" text-anchor="end" class="mono">$300</text>
  <line x1="28" y1="342" x2="452" y2="342" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="36" y="360" font-size="12" font-weight="500" fill="#1F2937">Labor (per hour)</text>
  <text x="320" y="360" font-size="12" fill="#1F2937" text-anchor="end" class="mono">24</text>
  <text x="388" y="360" font-size="12" fill="#1F2937" text-anchor="end" class="mono">$95</text>
  <text x="444" y="360" font-size="12" font-weight="600" fill="#1F2937" text-anchor="end" class="mono">$2,280</text>

  <!-- Totals -->
  <text x="340" y="400" font-size="13" fill="#6B7280" text-anchor="end">Subtotal</text>
  <text x="444" y="400" font-size="13" font-weight="500" fill="#1F2937" text-anchor="end" class="mono">$2,930.00</text>

  <text x="340" y="420" font-size="13" fill="#6B7280" text-anchor="end">Tax (8.5%)</text>
  <text x="444" y="420" font-size="13" font-weight="500" fill="#1F2937" text-anchor="end" class="mono">$249.05</text>

  <line x1="340" y1="430" x2="452" y2="430" stroke="#1F2937" stroke-width="2"/>
  <text x="340" y="454" font-size="16" font-weight="700" fill="#1F2937" text-anchor="end">Total</text>
  <text x="444" y="454" font-size="18" font-weight="700" fill="#2B4C7E" text-anchor="end" class="mono">$3,179.05</text>

  <!-- Notes section -->
  <rect x="28" y="474" width="424" height="48" rx="6" fill="#F3F4F6"/>
  <text x="40" y="494" font-size="10" font-weight="700" fill="#6B7280" letter-spacing="0.5">NOTES</text>
  <text x="40" y="512" font-size="11" fill="#6B7280">Includes all materials and labor. Disposal of old fixtures included.</text>

  <!-- Footer -->
  <line x1="0" y1="534" x2="480" y2="534" stroke="#E5E7EB" stroke-width="1"/>
  <text x="240" y="550" text-anchor="middle" font-size="11" fill="#9CA3AF">Created with QuoteCraft</text>
</svg>
