<svg viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'DM Sans', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <defs>
    <filter id="sfs" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Card -->
  <rect width="300" height="160" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#sfs)"/>

  <!-- Header -->
  <rect width="300" height="44" rx="12" fill="#FFFFFF"/>
  <rect y="32" width="300" height="12" fill="#FFFFFF"/>
  <line x1="0" y1="43.5" x2="300" y2="43.5" stroke="#E5E7EB" stroke-width="1"/>
  <text x="20" y="29" font-size="13" font-weight="700" fill="#6B7280" letter-spacing="0.8">DETAILS</text>

  <!-- Row 1 -->
  <text x="20" y="72" font-size="12" font-weight="500" fill="#6B7280">Quote #</text>
  <text x="280" y="72" font-size="14" font-weight="500" fill="#1F2937" text-anchor="end">QC-2026-0042</text>
  <line x1="20" y1="83" x2="280" y2="83" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Row 2 -->
  <text x="20" y="104" font-size="12" font-weight="500" fill="#6B7280">Created</text>
  <text x="280" y="104" font-size="14" font-weight="500" fill="#1F2937" text-anchor="end">Feb 10, 2026</text>
  <line x1="20" y1="115" x2="280" y2="115" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="20" y="136" font-size="12" font-weight="500" fill="#6B7280">Valid Until</text>
  <text x="280" y="136" font-size="14" font-weight="500" fill="#1F2937" text-anchor="end">Feb 25, 2026</text>
</svg>
