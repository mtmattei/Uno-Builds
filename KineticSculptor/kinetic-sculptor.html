<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Kinetic Sculptor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090f;
    --ink: #efe6d2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    cursor: none;
    color: var(--ink);
    font-family: 'Instrument Serif', serif;
  }
  #c {
    display: block;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }
  .veil {
    position: fixed;
    pointer-events: none;
    color: rgba(239, 230, 210, 0.55);
    font-style: italic;
    letter-spacing: 0.02em;
    transition: opacity 1.6s ease-out;
    mix-blend-mode: screen;
    text-shadow: 0 0 18px rgba(0,0,0,0.6);
  }
  .title {
    top: 28px; left: 32px;
    font-size: 22px;
  }
  .title em { font-weight: normal; }
  .title .dot {
    display: inline-block;
    width: 5px; height: 5px;
    background: rgba(255, 180, 90, 0.85);
    border-radius: 50%;
    margin: 0 8px 3px;
    vertical-align: middle;
    box-shadow: 0 0 14px rgba(255, 180, 90, 0.9);
  }
  .hint {
    bottom: 28px; right: 32px;
    font-size: 14px;
    letter-spacing: 0.18em;
    text-transform: lowercase;
    color: rgba(239, 230, 210, 0.32);
  }
  body.touched .veil { opacity: 0; }

  /* Vignette overlay */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="veil title"><em>Kinetic</em><span class="dot"></span><em>Sculptor</em></div>
  <div class="veil hint">drift &middot; push &middot; tap &middot; hold</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  let W = 0, H = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#07090f';
    ctx.fillRect(0, 0, W, H);
    initParticles();
  }

  // ---- Particles with elastic anchors ----
  // Particle count scales with screen area for consistent density.
  let N = 0;
  let P = [];

  function initParticles() {
    N = Math.min(2400, Math.max(900, Math.floor((W * H) / 900)));
    P = new Array(N);
    for (let i = 0; i < N; i++) {
      const ax = Math.random() * W;
      const ay = Math.random() * H;
      P[i] = {
        ax, ay,                                   // anchor (drifts with ambient flow)
        x: ax + (Math.random() - 0.5) * 24,
        y: ay + (Math.random() - 0.5) * 24,
        vx: 0, vy: 0,
        e: 0.04 + Math.random() * 0.08,           // energy 0..1
        seed: Math.random() * 1000
      };
    }
  }

  // ---- Pseudo-curl ambient flow ----
  // Cheap analytic field that gives slow rotational currents at rest.
  function flow(x, y, t, out) {
    const s = 0.0013;
    const a = Math.sin(x * s + t * 0.32) * Math.cos(y * s * 1.21 + t * 0.27);
    const b = Math.cos(x * s * 1.07 - t * 0.24) * Math.sin(y * s * 0.91 - t * 0.19);
    // Perpendicular swap ↦ curl-ish
    out.x = -b;
    out.y =  a;
  }
  const _flow = { x: 0, y: 0 };

  // ---- Disturbances ----
  const shocks = [];   // expanding rings from taps
  const pushes = [];   // recent drag impulses, decay over ~0.5s

  // ---- Pointer state ----
  const pointer = {
    x: -9999, y: -9999,
    prevX: -9999, prevY: -9999,
    down: false,
    downX: 0, downY: 0,
    downTime: 0,
    movedSinceDown: 0,
    lastMoveTime: 0,
    speed: 0          // smoothed px/sec
  };
  let touched = false;

  function markTouched() {
    if (!touched) {
      touched = true;
      document.body.classList.add('touched');
    }
  }

  function onMove(e) {
    const x = e.clientX, y = e.clientY;
    const now = performance.now();
    if (pointer.x > -9000) {
      const dx = x - pointer.x;
      const dy = y - pointer.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const dt = Math.max(now - pointer.lastMoveTime, 1);
      const speed = dist / dt * 1000; // px/sec
      pointer.speed = pointer.speed * 0.55 + speed * 0.45;

      if (pointer.down) {
        pointer.movedSinceDown += dist;
        // Add a transient drag impulse. Speed determines smoothness vs turbulence.
        pushes.push({
          x, y,
          dx, dy,
          life: 1,
          speed
        });
        if (pushes.length > 80) pushes.shift();
      } else {
        // Even on hover (no button), produce a very gentle wake.
        if (dist > 1.5) {
          pushes.push({
            x, y,
            dx: dx * 0.35, dy: dy * 0.35,
            life: 0.45,
            speed: speed * 0.5
          });
          if (pushes.length > 80) pushes.shift();
        }
      }
    }
    pointer.prevX = pointer.x;
    pointer.prevY = pointer.y;
    pointer.x = x;
    pointer.y = y;
    pointer.lastMoveTime = now;
    markTouched();
  }

  function onDown(e) {
    pointer.down = true;
    pointer.downX = e.clientX;
    pointer.downY = e.clientY;
    pointer.downTime = performance.now();
    pointer.movedSinceDown = 0;
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    markTouched();
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
  }

  function onUp(e) {
    const dur = performance.now() - pointer.downTime;
    if (pointer.movedSinceDown < 7 && dur < 260) {
      // Tap → shockwave
      shocks.push({
        x: e.clientX, y: e.clientY,
        r: 0,
        maxR: Math.hypot(W, H) * 0.85,
        strength: 1
      });
    }
    pointer.down = false;
  }

  function onLeave() {
    pointer.down = false;
    pointer.x = pointer.y = -9999;
    pointer.speed = 0;
  }

  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onLeave);
  canvas.addEventListener('pointerleave', onLeave);
  window.addEventListener('blur', onLeave);

  window.addEventListener('resize', resize);

  // ---- Simulation ----
  let t0 = performance.now();
  let lastFrame = t0;

  function step(dt) {
    const t = (performance.now() - t0) / 1000;

    // Decay shockwaves
    for (let i = shocks.length - 1; i >= 0; i--) {
      const s = shocks[i];
      s.r += dt * 760;
      s.strength *= Math.pow(0.55, dt);
      if (s.r > s.maxR || s.strength < 0.02) shocks.splice(i, 1);
    }

    // Decay pushes
    for (let i = pushes.length - 1; i >= 0; i--) {
      const ps = pushes[i];
      ps.life -= dt * 2.2;
      if (ps.life <= 0) pushes.splice(i, 1);
    }

    // Hold detection — after stationary press, become a gravity well
    const holdMs = pointer.down ? (performance.now() - pointer.downTime) : 0;
    const holding = pointer.down && pointer.movedSinceDown < 6 && holdMs > 180;
    const holdStrength = holding ? Math.min(1, (holdMs - 180) / 600) : 0;

    for (let i = 0; i < N; i++) {
      const p = P[i];

      // Anchor drifts slowly with ambient flow → whole pattern breathes
      flow(p.ax, p.ay, t * 0.5, _flow);
      p.ax += _flow.x * 14 * dt;
      p.ay += _flow.y * 14 * dt;
      // Wrap anchors so the field never empties out at edges
      if (p.ax < -30) p.ax += W + 60;
      else if (p.ax > W + 30) p.ax -= W + 60;
      if (p.ay < -30) p.ay += H + 60;
      else if (p.ay > H + 30) p.ay -= H + 60;

      // ----- forces -----
      let fx = 0, fy = 0;

      // Spring back to anchor → elastic fabric feel
      const sx = p.ax - p.x;
      const sy = p.ay - p.y;
      const stretch = Math.sqrt(sx * sx + sy * sy);
      fx += sx * 1.6;
      fy += sy * 1.6;

      // Local higher-frequency ambient flow → finer currents
      flow(p.x, p.y, t, _flow);
      fx += _flow.x * 32;
      fy += _flow.y * 32;

      // Drag pushes
      for (let j = 0; j < pushes.length; j++) {
        const ps = pushes[j];
        const dx = p.x - ps.x;
        const dy = p.y - ps.y;
        const d2 = dx * dx + dy * dy;
        const R = 130;
        if (d2 < R * R) {
          const d = Math.sqrt(d2) + 0.001;
          const falloff = (1 - d / R) * ps.life;
          // Speed in px/sec. Below ~600 = smooth flow, above = turbulent.
          const turb = Math.min(1, Math.max(0, (ps.speed - 350) / 1400));

          // Smooth: push along motion direction
          const smoothK = (1 - turb) * falloff * 14;
          fx += ps.dx * smoothK;
          fy += ps.dy * smoothK;

          // Turbulent: perpendicular swirl with high-freq noise
          if (turb > 0.01) {
            const perpX = -ps.dy;
            const perpY =  ps.dx;
            const swirlPhase = Math.sin(d * 0.13 + p.seed + t * 7);
            const swirlK = turb * falloff * 26 * swirlPhase;
            fx += perpX * swirlK;
            fy += perpY * swirlK;
            // Plus chaotic jitter
            fx += (Math.sin(p.seed * 3.7 + t * 11) * 22) * turb * falloff;
            fy += (Math.cos(p.seed * 4.1 + t * 13) * 22) * turb * falloff;
          }

          // Inject energy
          p.e = Math.min(1, p.e + falloff * (0.18 + turb * 0.55) * dt * 7);
        }
      }

      // Shockwave rings
      for (let j = 0; j < shocks.length; j++) {
        const s = shocks[j];
        const dx = p.x - s.x;
        const dy = p.y - s.y;
        const d = Math.sqrt(dx * dx + dy * dy) + 0.001;
        const ringW = 55;
        const off = d - s.r;
        if (Math.abs(off) < ringW) {
          const k = (1 - Math.abs(off) / ringW) * s.strength;
          const push = k * 950;
          fx += (dx / d) * push;
          fy += (dy / d) * push;
          p.e = Math.min(1, p.e + k * 0.7);
        }
      }

      // Hold → gravity well
      if (holdStrength > 0) {
        const dx = pointer.downX - p.x;
        const dy = pointer.downY - p.y;
        const d = Math.sqrt(dx * dx + dy * dy) + 0.001;
        const R = 260;
        if (d < R) {
          const k = (1 - d / R) * holdStrength;
          const pull = k * 380;
          fx += (dx / d) * pull;
          fy += (dy / d) * pull;
          // Tangential swirl as it tightens → creates orbital cluster
          const tangK = k * 220 * Math.min(1, holdMs / 1500);
          fx += (-dy / d) * tangK;
          fy += ( dx / d) * tangK;
          p.e = Math.min(1, p.e + k * 0.4 * dt);
        }
      }

      // Stretch glow — high-strain particles light up
      if (stretch > 30) {
        p.e = Math.max(p.e, Math.min(0.85, (stretch - 30) / 180));
      }

      // Integrate
      p.vx += fx * dt;
      p.vy += fy * dt;
      // Damping — exponential per real-time so framerate-independent
      const damp = Math.pow(0.86, dt * 60);
      p.vx *= damp;
      p.vy *= damp;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // Energy decay
      p.e *= Math.pow(0.91, dt * 60);
    }
  }

  // ---- Render ----
  function render() {
    // Trail fade — low alpha keeps paths visible long enough that sustained
    // movement deposits visible ridges/flows (emergence).
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(7, 9, 15, 0.085)';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    // Particles
    for (let i = 0; i < N; i++) {
      const p = P[i];
      const e = p.e;
      const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);

      // Color ramp: ivory ↦ amber ↦ near-white-hot
      let r, g, b, a;
      if (e < 0.32) {
        const k = e / 0.32;
        r = 200 + k * 35;
        g = 195 + k * 25;
        b = 178 + k * 18;
        a = 0.16 + e * 0.55;
      } else if (e < 0.72) {
        const k = (e - 0.32) / 0.4;
        r = 235 + k * 20;
        g = 220 - k * 50;
        b = 196 - k * 130;
        a = 0.42 + e * 0.42;
      } else {
        const k = (e - 0.72) / 0.28;
        r = 255;
        g = 170 + k * 70;
        b = 66 + k * 150;
        a = 0.78 + e * 0.22;
      }

      const size = 0.55 + e * 2.4 + Math.min(speed, 220) * 0.0045;

      ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${a})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fill();

      // Soft halo on energetic particles ↦ glow / depth
      if (e > 0.35) {
        const haloA = (e - 0.35) * 0.18;
        ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${haloA})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, size * 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Faint shockwave ring (subtle visual confirmation)
    for (let i = 0; i < shocks.length; i++) {
      const s = shocks[i];
      ctx.strokeStyle = `rgba(255, 198, 132, ${s.strength * 0.22})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Pointer glow — subtle cursor
    if (pointer.x > -9000) {
      const holding = pointer.down &&
                      pointer.movedSinceDown < 6 &&
                      (performance.now() - pointer.downTime) > 180;
      const r0 = holding ? 14 : 6;
      const r1 = holding ? 70 : 32;
      const aIn = holding ? 0.32 : 0.14;
      const grd = ctx.createRadialGradient(
        pointer.x, pointer.y, r0,
        pointer.x, pointer.y, r1
      );
      grd.addColorStop(0, `rgba(255, 218, 168, ${aIn})`);
      grd.addColorStop(1, 'rgba(255, 218, 168, 0)');
      ctx.fillStyle = grd;
      ctx.fillRect(pointer.x - r1, pointer.y - r1, r1 * 2, r1 * 2);
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  function loop() {
    const now = performance.now();
    let dt = (now - lastFrame) / 1000;
    if (dt > 0.05) dt = 0.05; // clamp for tab-switch hitches
    lastFrame = now;
    step(dt);
    render();
    requestAnimationFrame(loop);
  }

  resize();
  loop();
})();
</script>
</body>
</html>
